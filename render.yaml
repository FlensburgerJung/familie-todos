# Render-Blueprint: legt den Dienst mit einem Klick an.
# Die Datenbank kommt von Neon (kostenlos, läuft nicht ab) - deren
# Verbindungs-URL wird unten als DATABASE_URL eingetragen.
services:
  - type: web
    name: familie-todos
    runtime: python
    plan: free              # für Dauerbetrieb ohne Einschlafen: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Ein Prozess mit mehreren Threads statt zweier Prozesse: spart Arbeits-
    # speicher auf kleinen Instanzen, und eine langsame Modellantwort blockiert
    # trotzdem nicht die uebrigen Anfragen.
    startCommand: gunicorn app.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD      # Familienpasswort - ohne startet die App nicht
        sync: false
      - key: DATABASE_URL      # Verbindungs-URL von Neon
        sync: false
      - key: MISTRAL_API_KEY   # Schlüssel des gewählten Anbieters
        sync: false

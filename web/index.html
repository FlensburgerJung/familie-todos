<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Familie ToDos</title>
  <meta name="theme-color" content="#3a6b52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ToDos">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1><button type="button" id="home-link">Familie ToDos</button></h1>
      <span class="head-badges">
        <span id="me-badge"></span>
        <span class="engine-badge" id="engine-badge">…</span>
        <button type="button" class="theme-toggle" id="theme-toggle"
                aria-label="Farbschema umschalten"></button>
      </span>
    </header>

    <form class="capture" id="capture-form">
      <textarea id="capture-text" rows="2" enterkeyhint="send"
        placeholder="Einfach reinwerfen: „Heizung tropft, Hausverwaltung anschreiben“"></textarea>
      <div class="horizons" id="horizons" role="group" aria-label="Wann muss das erledigt sein?"></div>
      <div class="capture-assign">
        <select id="capture-list" aria-label="Liste (sonst entscheidet die Einordnung)"></select>
        <select id="capture-person" aria-label="Wer (sonst entscheidet die Einordnung)"></select>
      </div>
      <div class="capture-row">
        <span class="capture-hint" id="capture-hint">Wird automatisch einsortiert.</span>
        <div class="capture-buttons">
          <button type="button" class="btn btn-sm capture-kind" id="capture-shop"
                  title="Auf einen Einkaufszettel">🛒 Einkauf</button>
          <button type="button" class="btn btn-sm capture-kind" id="capture-wish"
                  title="Direkt auf einen Wunschzettel">🎁 Wunsch</button>
          <button type="button" class="btn btn-sm capture-kind" id="capture-media"
                  title="Buch, Film, Podcast oder Artikel zum Merken">🎬 Merken</button>
          <button type="submit" class="btn btn-primary" id="capture-submit">Rein damit</button>
        </div>
      </div>
    </form>

    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="view"></main>
  </div>

  <button id="fab" class="fab" type="button" aria-label="Neues Todo einwerfen">＋</button>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
